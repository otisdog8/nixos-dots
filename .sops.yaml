keys:
  - &recusant_host age1vawwp80rdgfkajed3tvluzgucl3ykh8ra5r4ullqcze8hj4lr9jsldezda
  - &galaxy_host age17r8aq0y6mrtwqtwffp6t9a8fu0pdar6yerwzq6sr4m6ppk880gwqypxy6k
  # Admin workstation (constitution host key). Lets you edit secrets directly
  # from constitution without SSHing to a host that holds a recipient key.
  - &constitution_host age1850lrhfzq39frupln50mgqwxhgzlv78kzmgwxadk0wszxgxlhausq86luv
  - &excelsior_host age1a3h89x7vayasxmrvjhvqws2da6ck8jnpe8gxhjfutke9u7x83anqnls6u4
  # k3s node VMs (ssh-to-age of /persist/etc/ssh/ssh_host_ed25519_key.pub on each guest).
  - &arquitens_node age1y4ffuhz7gzlf7jeyr9jx0wdn9vsfj7aepzwz034x8lqtuyvnxu8s2xut82
  - &carrack_node age1a9es4xeqx7jmlkelwemngg5l0y7lpsvjpdklc4zfl5gqcfyzkd9qrh3cr7
  - &munificent_node age19f6cnz38nv5prpezwp9yp32w0tcwylnpex8pgzxk640jgc6gjezs6ueaxf
  # The sensitive cluster's server VMs (hosts/<machine>-sensitive): ssh-to-age
  # of /persist/etc/ssh/ssh_host_ed25519_key.pub, made on each guest's disk
  # from its hypervisor (sensitive-common.nix, bootstrap step 3).
  - &arquitens_sensitive age1p5g0uksx65sjtcfka8q4vj57t63z3tdqm7upnmdyc0665endzggsfzsuya
  - &carrack_sensitive age1947jn6rvlmfnudvm0t3lld9k4f89wa3c27h4shu4ytc80dpc4q8qxnl503
  - &munificent_sensitive age147xkdu56y4xkqgzltj7mea27grhtcewpg58hmth34elazkgk4grq9rh7k3
creation_rules:
  # The sensitive cluster's k3s token (modules/system/k3s-sensitive.nix): its
  # three servers and the admin workstations only. Never a main node or
  # recusant: the main cluster must not be able to join this one.
  - path_regex: .*hosts/sensitive-k3s-token\.yaml
    age:
      - *arquitens_sensitive
      - *carrack_sensitive
      - *munificent_sensitive
      - *galaxy_host
      - *constitution_host
  # k3s cluster token, decrypted on every k3s server node (modules/system/k3s/token-sops.nix).
  - path_regex: .*system/k3s/k3s-token\.yaml
    age:
      - *arquitens_node
      - *carrack_node
      - *munificent_node
      - *galaxy_host
      - *constitution_host
  # Constitution: borg backup passphrase (borgbase).
  - path_regex: .*constitution\.yaml
    age:
      - *constitution_host
      - *galaxy_host
  # Galaxy: borg backup passphrase (borgbase).
  - path_regex: .*galaxy\.yaml
    age:
      - *galaxy_host
      - *constitution_host
  # Excelsior: borg backup passphrase (borgbase).
  - path_regex: .*excelsior\.yaml
    age:
      - *excelsior_host
      - *galaxy_host
      - *constitution_host
  - path_regex: .*recusant\.yaml
    age:
      - *recusant_host
      - *galaxy_host
      - *constitution_host
  # agent-auth secrets (dotenv env file + binary credentials like the GitHub
  # App PEM and the k8s provisioner token).
  - path_regex: .*recusant/secrets/agent-auth.*
    age:
      - *recusant_host
      - *galaxy_host
      - *constitution_host
  # Hermes agent zones (per-agent dotenv env files) + the shared hindsight
  # memory service.
  - path_regex: .*recusant/secrets/(hermes-homelab-recusant|hindsight).*
    age:
      - *recusant_host
      - *galaxy_host
      - *constitution_host
  # Attic binary cache: RS256 JWT signing secret + the Garage S3 access key.
  - path_regex: .*recusant/secrets/atticd.*
    age:
      - *recusant_host
      - *galaxy_host
      - *constitution_host
  # Garage S3: inter-node RPC secret (GARAGE_RPC_SECRET).
  - path_regex: .*recusant/secrets/garage.*
    age:
      - *recusant_host
      - *galaxy_host
      - *constitution_host
  # Off-site S4 backups: restic + rclone S3 credentials (dotenv).
  - path_regex: .*recusant/secrets/s4-backups.*
    age:
      - *recusant_host
      - *galaxy_host
      - *constitution_host
